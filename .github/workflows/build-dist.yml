name: Build dist

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Prepare verified SDL3 x86 files
        shell: pwsh
        run: .\scripts\prepare-sdl3.ps1

      - name: Build native DLLs
        shell: cmd
        run: build.cmd

      - name: Build asset tools
        shell: cmd
        run: build-assets.cmd

      - name: Stage distribution files
        shell: pwsh
        run: .\scripts\stage-dist.ps1

      - name: Set installer version
        id: version
        shell: pwsh
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 8)
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT

      - name: Prepare verified NSIS
        shell: pwsh
        run: |
          $nsisRoot = .\scripts\prepare-nsis.ps1
          "NSIS_ROOT=$nsisRoot" >> $env:GITHUB_ENV

      - name: Build NSIS installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -NsisRoot $env:NSIS_ROOT -GitHash "${{ steps.version.outputs.short_sha }}"

      - name: Upload standalone installer
        uses: actions/upload-artifact@v7
        with:
          path: dist/DeadSpace1-KR-0.1.exe
          if-no-files-found: error
          retention-days: 30
          archive: false
