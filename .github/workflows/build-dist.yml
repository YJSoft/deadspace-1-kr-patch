name: Build dist

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Prepare verified SDL3 x86 files
        shell: pwsh
        run: .\scripts\prepare-sdl3.ps1

      - name: Build native DLLs
        shell: cmd
        run: build.cmd

      - name: Build asset tools
        shell: cmd
        run: build-assets.cmd

      - name: Stage distribution files
        shell: pwsh
        run: .\scripts\stage-dist.ps1

      - name: Set installer version
        id: version
        shell: pwsh
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 8)
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT

      - name: Prepare verified NSIS
        shell: pwsh
        run: |
          $nsisRoot = .\scripts\prepare-nsis.ps1
          "NSIS_ROOT=$nsisRoot" >> $env:GITHUB_ENV

      - name: Build NSIS installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -NsisRoot $env:NSIS_ROOT -GitHash "${{ steps.version.outputs.short_sha }}"

      - name: Upload standalone installer
        uses: actions/upload-artifact@v7
        with:
          path: dist/DeadSpace1-KR-0.2.exe
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Publish rolling nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $asset = "dist/DeadSpace1-KR-0.2.exe"
          $notes = "main 브랜치 최신 자동 빌드입니다.`n`n커밋: ${{ github.sha }}`n`n번역 검수용 버전이므로 테스트 전 원본 세이브를 별도로 보관하십시오."

          gh release view nightly --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete-asset nightly "DeadSpace1-KR-0.1.exe" -y 2> $null
            gh release upload nightly $asset --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to replace the nightly release asset." }
            gh release edit nightly --title "Dead Space KR 0.2 Nightly" --notes $notes --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Failed to update the nightly release." }
          } else {
            gh release create nightly $asset --target "${{ github.sha }}" --title "Dead Space KR 0.2 Nightly" --notes $notes --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Failed to create the nightly release." }
          }
