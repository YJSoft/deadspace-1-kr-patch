[package]
name = "deadspace1-kr-installer"
version = "0.3.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
anyhow = "1.0"
crc32fast = "1.4"
fltk = { version = "1.5.23", features = ["fltk-bundled"] }
md5 = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
